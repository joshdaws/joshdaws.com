<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools & Credits — Josh Daws</title>
<meta name="description" content="Tools and data sources used across Josh Daws projects.">
<meta property="og:title" content="Tools & Credits — Josh Daws">
<meta property="og:description" content="Tools and data sources used across Josh Daws projects.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://joshdaws.com/tools.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@700;800;900&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-deep: #0d0d0d;
  --bg-surface: #1a1a1a;
  --bg-card: #222222;
  --bg-card-hover: #2a2a2a;
  --text-primary: #f0ece4;
  --text-secondary: #a8a49c;
  --gold: #c8a86e;
  --gold-dim: rgba(200, 168, 110, 0.15);
  --gold-glow: rgba(200, 168, 110, 0.08);
  --stripe-color: rgba(200, 168, 110, 0.03);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --focus-ring: 0 0 0 2px var(--bg-deep), 0 0 0 4px var(--gold);
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow-x: hidden;
}

/* Diagonal stripe texture */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 40px,
    var(--stripe-color) 40px,
    var(--stripe-color) 41px
  );
  pointer-events: none;
  z-index: 0;
}

/* Subtle top gradient wash */
body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40vh;
  background: radial-gradient(ellipse at 50% 0%, var(--gold-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 640px;
  padding: 3.5rem 1.5rem 4rem;
}

/* ——— Animations ——— */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes drawIn {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

/* ——— Back link ——— */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
  text-decoration: none;
  margin-bottom: 2.5rem;
  transition: color 0.25s var(--ease-out);
  animation: fadeUp 0.5s var(--ease-out) both;
}

.back-link:hover {
  color: var(--gold);
}

.back-link:focus-visible {
  outline: none;
  color: var(--gold);
  box-shadow: var(--focus-ring);
  border-radius: 4px;
}

.back-link svg {
  width: 14px;
  height: 14px;
}

/* ——— Header ——— */
.header {
  text-align: center;
  margin-bottom: 3rem;
  animation: fadeUp 0.6s var(--ease-out) both;
}

.page-title {
  font-family: 'Raleway', sans-serif;
  font-size: 2.25rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.15;
  color: #ffffff;
}

.page-subtitle {
  font-family: 'Open Sans', sans-serif;
  margin-top: 0.75rem;
  font-size: 0.85rem;
  font-weight: 400;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.divider {
  width: 48px;
  height: 2px;
  background: var(--gold);
  margin: 1.5rem auto 0;
  border-radius: 1px;
  animation: drawIn 0.8s var(--ease-out) 0.3s both;
}

/* ——— Credits section ——— */
.credits-section {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  animation: fadeUp 0.5s var(--ease-out) 0.2s both;
}

.section-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-secondary);
  padding-left: 0.25rem;
  margin-bottom: 0.25rem;
}

.link-card {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  grid-template-rows: auto auto;
  column-gap: 0.625rem;
  row-gap: 0.375rem;
  align-items: center;
  padding: 1.125rem 1rem;
  background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 12px;
  text-decoration: none;
  color: var(--text-primary);
  transition:
    background-color 0.25s var(--ease-out),
    border-color 0.25s var(--ease-out),
    transform 0.25s var(--ease-out),
    box-shadow 0.25s var(--ease-out);
  position: relative;
  overflow: hidden;
}

.link-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, var(--gold-dim) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.25s var(--ease-out);
  pointer-events: none;
}

.link-card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(200, 168, 110, 0.15);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.link-card:hover::before {
  opacity: 1;
}

.link-card:active {
  transform: translateY(0);
  transition-duration: 0.1s;
}

.link-card:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.card-icon {
  position: relative;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  grid-row: 1;
  grid-column: 1;
}

.card-icon svg {
  width: 20px;
  height: 20px;
}

.card-title {
  position: relative;
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.3;
  grid-row: 1;
  grid-column: 2;
}

.card-subtitle {
  position: relative;
  font-size: 0.7rem;
  color: var(--text-secondary);
  font-weight: 400;
  line-height: 1.4;
  grid-row: 2;
  grid-column: 1 / -1;
}

.card-arrow {
  grid-row: 1;
  grid-column: 3;
  color: var(--text-secondary);
  opacity: 0;
  transition: opacity 0.25s var(--ease-out);
}

.card-arrow svg {
  width: 14px;
  height: 14px;
}

.link-card:hover .card-arrow {
  opacity: 0.6;
}

/* ——— Footer ——— */
.footer {
  text-align: center;
  margin-top: 3.5rem;
  padding-top: 2rem;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  animation: fadeUp 0.5s var(--ease-out) 0.4s both;
}

.footer-text {
  font-size: 0.7rem;
  color: var(--text-secondary);
  font-weight: 400;
  letter-spacing: 0.05em;
  font-style: italic;
}

/* ——— Responsive ——— */
@media (max-width: 480px) {
  .container {
    padding: 2.5rem 1.25rem 3rem;
  }

  .page-title {
    font-size: 1.875rem;
  }
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  html {
    scroll-behavior: auto;
  }
}
</style>
</head>
<body>

<div class="container">

  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Back to joshdaws.com</span>
  </a>

  <header class="header">
    <h1 class="page-title">Tools &amp; Credits</h1>
    <p class="page-subtitle">Data sources &amp; attributions</p>
    <div class="divider" aria-hidden="true"></div>
  </header>

  <section class="credits-section" aria-label="Credits">

    <span class="section-label">Music data</span>

    <a href="https://getsongbpm.com" class="link-card" target="_blank" rel="noopener">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <span class="card-title">BPM data powered by GetSongBPM</span>
      <span class="card-subtitle">Tempo, key, and song metadata courtesy of getsongbpm.com</span>
      <div class="card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg></div>
    </a>

  </section>

  <footer class="footer">
    <p class="footer-text">Soli Deo Gloria</p>
  </footer>

</div>

</body>
</html>
